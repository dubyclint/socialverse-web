name: Android release (Play Internal Testing)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Locked application id — must never change: the Play listing and the
      # future Personal -> Company transfer are bound to it.
      APPLICATION_ID: com.viorp.app
      # The Supabase url/anon key are public values, so they may live in either
      # repository secrets or repository variables.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NUXT_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL || vars.NUXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NUXT_PUBLIC_SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || vars.NUXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      # A missing secret otherwise surfaces as an inscrutable Gradle "Value is
      # null" 15 minutes in, or as an app shipped without a backend.
      - name: Check required secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          for name in SUPABASE_URL SUPABASE_ANON_KEY KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships the SDK; setup-android only accepts the licences
      # and skips its default `tools` package, which no longer exists.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install dependencies
        run: npm ci

      - name: Build static web bundle and sync Capacitor
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
        run: npm run build:mobile

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/viorp-release.jks"
          [ -s "$RUNNER_TEMP/viorp-release.jks" ] || { echo "::error::KEYSTORE_BASE64 did not decode to a keystore"; exit 1; }

      - name: Build signed AAB
        working-directory: android
        env:
          VIORP_KEYSTORE_FILE: ${{ runner.temp }}/viorp-release.jks
          VIORP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VIORP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VIORP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Play rejects a re-used versionCode, so it tracks the run number.
          VIORP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: viorp-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish to Play Internal Testing
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.viorp.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
