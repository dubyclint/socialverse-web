name: Android release (Play Internal Testing)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Locked application id — must never change: the Play listing and the
      # future Personal -> Company transfer are bound to it.
      APPLICATION_ID: com.viorp.app
      NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build static web bundle and sync Capacitor
        run: npm run build:mobile

      - name: Restore release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/viorp-release.jks"

      - name: Build signed AAB
        working-directory: android
        env:
          VIORP_KEYSTORE_FILE: ${{ runner.temp }}/viorp-release.jks
          VIORP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VIORP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VIORP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Play rejects a re-used versionCode, so it tracks the run number.
          VIORP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: viorp-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish to Play Internal Testing
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.viorp.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
